# Every AI service call goes to FakeOpenAiResource in this same app: no API key, no network, no containers.
# The test port is fixed (and unusual) because the base URL has to name it; a random test port (0) can't be referenced.
quarkus.http.test-port=18089
quarkus.langchain4j.openai.api-key=not-used
quarkus.langchain4j.openai.base-url=http://localhost:${quarkus.http.test-port}/fake-openai/v1
quarkus.langchain4j.openai.timeout=10s
